project:
  name: apex-review-qwen25vl-qlora
  seed: 42

model:
  id: Qwen/Qwen2.5-VL-3B-Instruct
  revision: null
  trust_remote_code: false
  attention: sdpa
  dtype: bfloat16
  quantization:
    load_in_4bit: true
    quant_type: nf4
    double_quant: true
    compute_dtype: bfloat16

vision:
  num_frames: 8
  min_pixel_tokens: 128
  max_pixel_tokens: 512

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_suffixes:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  train_file: data/prepared/train.jsonl
  eval_file: data/prepared/val.jsonl
  output_dir: outputs/qlora
  num_train_epochs: 3
  learning_rate: 0.0001
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 5
  save_total_limit: 2
  max_grad_norm: 1.0

generation:
  max_new_tokens: 900
  do_sample: false

evaluation:
  schema: schemas/apex_review.schema.json
  temporal_iou_threshold: 0.3
