server:
  port: 8081

spring:
  application:
    name: video-worker

  profiles:
    active: dev

  kafka:
    consumer:
      # 同步处理长任务时一次只拉取一条，避免同批任务耗时累加到下一次 poll。
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:1}
      properties:
        # AI 任务最长30分钟，预留10分钟用于存储、数据库和网络抖动。
        "[max.poll.interval.ms]": ${KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:2400000}

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.videoai.common.domain
  configuration:
    map-underscore-to-camel-case: true

# Worker配置
videoai:
  kafka:
    task-topic:
      # 分区数决定同一消费组的视频分析并行上限。
      partitions: ${VIDEOAI_KAFKA_TASK_PARTITIONS:6}
      # 本地默认单副本；三Broker生产集群建议通过环境变量设为3。
      replicas: ${VIDEOAI_KAFKA_TASK_REPLICAS:1}

  worker:
    # 并发处理数
    concurrency: ${VIDEOAI_WORKER_CONCURRENCY:3}
    # 每秒最大AI请求数
    ai-qps-limit: 2
    # 单任务超时（分钟）
    task-timeout-minutes: 30

  # Transactional Outbox 投递参数（经 2026-08-31 缩时全链路压测标定）。
  outbox:
    # 10 条/秒对照中，Batch=100 相比 50 未降低 p95，因此取收益拐点处的较小值。
    dispatch-batch-size: ${VIDEOAI_OUTBOX_DISPATCH_BATCH_SIZE:50}
    # 3 条/秒稳态下 p95=1.38s；500ms 虽降至 0.85s，但空闲轮询频率翻倍。
    dispatch-interval-ms: ${VIDEOAI_OUTBOX_DISPATCH_INTERVAL_MS:1000}
    callback-threads: ${VIDEOAI_OUTBOX_CALLBACK_THREADS:10}
    send-timeout-ms: ${VIDEOAI_OUTBOX_SEND_TIMEOUT_MS:10000}
    recovery-interval-ms: ${VIDEOAI_OUTBOX_RECOVERY_INTERVAL_MS:60000}

  # 视频处理配置
  video:
    # 抽帧间隔（秒）
    frame-interval: 2
    # 每帧最大宽度（像素）
    max-frame-width: 1280
    # 每帧最大高度（像素）
    max-frame-height: 720
    # 临时文件目录
    temp-dir: /tmp/videoai

# 日志配置
  rag:
    legend-alias-enhancement-enabled: ${RAG_LEGEND_ALIAS_ENHANCEMENT_ENABLED:true}
    enabled: true
    fail-open: true
    knowledge-base: apex-default
    query-expansion-enabled: false
    # 与 API 保持一致，实验确认后统一切换默认值
    legend-pc-gameplay-filter-enabled: ${RAG_LEGEND_PC_GAMEPLAY_FILTER_ENABLED:true}
    top-k: ${RAG_TOP_K:20}
    final-top-k: ${RAG_FINAL_TOP_K:3}
    max-chunks-per-card: ${RAG_MAX_CHUNKS_PER_CARD:2}
    # LEGEND 正负样本开发集标定值；扩大知识类别或更换 Embedding 后需重测
    min-score: ${RAG_MIN_SCORE:0.61}
    max-context-chars: ${RAG_MAX_CONTEXT_CHARS:3500}
    chunk-target-chars: 650
    chunk-min-chars: 400
    chunk-max-chars: 800
    chunk-overlap-chars: 100
    scan-batch-size: 20
    scan-interval-ms: 3000
    processing-timeout-seconds: 1800
    rebuild-processing-timeout-seconds: 21600
    vector:
      provider: milvus
      base-url: ${MILVUS_BASE_URL:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      database: default
      collection: ${VIDEOAI_RAG_VECTOR_COLLECTION:apex_knowledge_chunk_l03_v1}
      metric-type: COSINE
      index-type: HNSW
      connect-timeout-seconds: 10
      timeout-seconds: 30
      hnsw-m: 16
      hnsw-ef-construction: 200
      search-ef: 64
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:dashscope}
      base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${RAG_EMBEDDING_API_KEY:}
      model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
      dimension: 1024
      connect-timeout-seconds: 10
      timeout-seconds: 30
      dashscope:
        text-type: ${RAG_DASHSCOPE_TEXT_TYPE:document}

logging:
  level:
    root: info
    com.videoai: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
