server:
  port: 8081

spring:
  application:
    name: video-worker

  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.videoai.common.domain
  configuration:
    map-underscore-to-camel-case: true

# Worker配置
videoai:
  dispatch:
    video-concurrency: 3
  video:
    # 抽帧间隔（秒）
    frame-interval: 2
    # 每帧最大宽度（像素）
    max-frame-width: 1280
    # 每帧最大高度（像素）
    max-frame-height: 720
    # 临时文件目录
    temp-dir: /tmp/videoai

# 日志配置
  rag:
    legend-alias-enhancement-enabled: ${RAG_LEGEND_ALIAS_ENHANCEMENT_ENABLED:true}
    # 与 API 保持一致：heading_path 只作为元数据保存，不参与新任务的 Embedding
    embedding-heading-path-enabled: ${RAG_EMBEDDING_HEADING_PATH_ENABLED:false}
    enabled: true
    fail-open: true
    knowledge-base: apex-default
    query-expansion-enabled: false
    # 与 API 保持一致，实验确认后统一切换默认值
    legend-pc-gameplay-filter-enabled: ${RAG_LEGEND_PC_GAMEPLAY_FILTER_ENABLED:true}
    # 与 API 使用同一实验开关，默认保持纯向量基准
    hybrid-retrieval-enabled: ${RAG_HYBRID_RETRIEVAL_ENABLED:false}
    hybrid-lexical-union-enabled: ${RAG_HYBRID_LEXICAL_UNION_ENABLED:false}
    lexical-top-k: ${RAG_LEXICAL_TOP_K:20}
    rrf-k: ${RAG_RRF_K:60}
    dense-rrf-weight: ${RAG_DENSE_RRF_WEIGHT:1.0}
    lexical-rrf-weight: ${RAG_LEXICAL_RRF_WEIGHT:1.0}
    lexical-index-ttl-seconds: ${RAG_LEXICAL_INDEX_TTL_SECONDS:300}
    top-k: ${RAG_TOP_K:20}
    final-top-k: ${RAG_FINAL_TOP_K:3}
    # 与 API 调试链路保持一致，真实视频分析同样使用 Top20 中文重排
    rerank-enabled: ${RAG_RERANK_ENABLED:true}
    rerank-base-url: ${RAG_RERANK_BASE_URL:https://dashscope.aliyuncs.com/compatible-api/v1/reranks}
    # 未单独配置时复用 embedding.api-key
    rerank-api-key: ${RAG_RERANK_API_KEY:}
    rerank-model: ${RAG_RERANK_MODEL:qwen3-rerank}
    rerank-min-score: ${RAG_RERANK_MIN_SCORE:0.59}
    rerank-connect-timeout-millis: ${RAG_RERANK_CONNECT_TIMEOUT_MILLIS:1000}
    rerank-timeout-millis: ${RAG_RERANK_TIMEOUT_MILLIS:2000}
    rerank-fail-open: ${RAG_RERANK_FAIL_OPEN:true}
    max-chunks-per-card: ${RAG_MAX_CHUNKS_PER_CARD:2}
    # 与 API 保持一致，仅用于纯向量模式和重排失败回退
    min-score: ${RAG_MIN_SCORE:0.62}
    max-context-chars: ${RAG_MAX_CONTEXT_CHARS:3500}
    chunk-target-chars: 650
    chunk-min-chars: 400
    chunk-max-chars: 800
    chunk-overlap-chars: 100
    scan-batch-size: 20
    scan-interval-ms: 3000
    processing-timeout-seconds: 1800
    rebuild-processing-timeout-seconds: 21600
    vector:
      provider: milvus
      base-url: ${MILVUS_BASE_URL:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      database: default
      collection: ${VIDEOAI_RAG_VECTOR_COLLECTION:apex_knowledge_chunk_experiment_no_heading_v1}
      metric-type: COSINE
      index-type: HNSW
      connect-timeout-seconds: 10
      timeout-seconds: 30
      hnsw-m: 16
      hnsw-ef-construction: 200
      search-ef: 64
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:dashscope}
      base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${RAG_EMBEDDING_API_KEY:}
      model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
      dimension: 1024
      connect-timeout-seconds: 10
      timeout-seconds: 30
      dashscope:
        text-type: ${RAG_DASHSCOPE_TEXT_TYPE:document}

analysis:
  segments:
    threads: 4
    # 待压测起点；队列只缓存轻量工作，满时由父线程等待，实际等待受整局期限约束。
    queue-capacity: 16
    # 实例级限速；多实例共享账户限额在 P7 验收。
    request-interval-ms: 1000
    # 仅重试模型调用；最多尝试3次，退避约10/30秒并加入20%抖动。
    model-max-attempts: 3
    model-retry-initial-delay-ms: 10000
    cancellation-grace-ms: 2000
    max-response-bytes: 1048576
  text:
    base-url: ${TEXT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${TEXT_MODEL:qwen3-vl-flash}
    api-key: ${TEXT_API_KEY:}
    timeout-seconds: 120
    batch-size: 80
    overlap: 10
    max-request-bytes: 30000
    max-output-tokens: 4096
    max-batches: 64
    max-candidates: 500
    merge-gap-ms: 5000
    before-ms: 10000
    after-ms: 15000
    input-cny-per-million: 0.15
    output-cny-per-million: 1.5
    asr-cny-per-second: 0.00022
    # 工程费用预留；P4已记录实际tokens，P7以长片段及账户计价校准。
    video-reserve-cny-per-minute: 0.20
    max-estimated-task-cny: 10
  # 音频转写与候选片段准备配置。
  media:
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    ffprobe: ${FFPROBE_PATH:ffprobe}
    max-source-bytes: 10737418240
    max-workspace-bytes: 15032385536
    min-free-bytes: 536870912
    max-concurrent-workspaces: 2
    process-timeout-seconds: 600
    audio-part-ms: 1800000
    max-audio-parts: 64
    max-segment-ms: 180000
    max-selected-ms: 1800000
    # 合并扩展并拆分后，按时间顺序最多分析前8个片段。
    max-segments: 8
  asr:
    base-url: ${ASR_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    model: ${ASR_MODEL:fun-asr-2025-11-07}
    # 为空时复用 ai.dashscope.api-key；不写入执行快照。
    api-key: ${ASR_API_KEY:}
    request-timeout-seconds: 45
    poll-interval-seconds: 5
    max-wait-seconds: 1800
    signed-url-hours: 24

logging:
  level:
    root: info
    com.videoai: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
