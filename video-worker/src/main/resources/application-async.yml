# 完成 V1.8 迁移、停止旧 Worker 后使用 dev,async profile。
spring:
  datasource:
    druid:
      # SQL超时不能限制等待连接池/建立连接，分别给出上限。
      max-wait: 5000
      connect-timeout: 5000
      socket-timeout: 10000
  kafka:
    consumer:
      enable-auto-commit: false
      max-poll-records: 1
      properties:
        "[max.poll.interval.ms]": 300000
    listener:
      poll-timeout: 1s
videoai:
  worker:
    async-enabled: true
    concurrency: 3
    # 异步模式只做耗时提示，不强制终止视频；单次请求超时仍保留。
    task-timeout-minutes: 30
