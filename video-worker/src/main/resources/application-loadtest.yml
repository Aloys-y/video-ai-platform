# 压测配置必须与 dev profile 一起启用：--spring.profiles.active=dev,loadtest
ai:
  # 仅替换视频模型；ASR 和文本粗筛仍需单独隔离，不能据此认定全链路免费。
  provider: mock
  mock:
    # 600 倍缩时：2~4 分钟 -> 0.2~0.4 秒，8~12 分钟 -> 0.8~1.2 秒，
    # 24~30 分钟 -> 2.4~3 秒。
    short-ratio: ${LOAD_TEST_AI_SHORT_RATIO:60}
    medium-ratio: ${LOAD_TEST_AI_MEDIUM_RATIO:30}
    short-min-ms: ${LOAD_TEST_AI_SHORT_MIN_MS:200}
    short-max-ms: ${LOAD_TEST_AI_SHORT_MAX_MS:400}
    medium-min-ms: ${LOAD_TEST_AI_MEDIUM_MIN_MS:800}
    medium-max-ms: ${LOAD_TEST_AI_MEDIUM_MAX_MS:1200}
    long-min-ms: ${LOAD_TEST_AI_LONG_MIN_MS:2400}
    long-max-ms: ${LOAD_TEST_AI_LONG_MAX_MS:3000}
    presigned-url-expire-hours: 1

videoai:
  # 压测异步任务链路时关闭 RAG 外部 Embedding，防止产生额外模型调用。
  rag:
    enabled: false

logging:
  level:
    com.videoai.infra.mysql.mapper: info
