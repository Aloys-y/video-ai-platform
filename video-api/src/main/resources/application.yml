server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: video-api

  # 环境配置
  profiles:
    active: dev

  # 文件上传配置
  servlet:
    multipart:
      # 单个文件大小限制（分片上传不受此限制，因为分片走自定义接口）
      max-file-size: 1GB
      # 总上传大小限制
      max-request-size: 1100MB

  # Jackson配置
  jackson:
    # 日期格式
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区
    time-zone: Asia/Shanghai
    # LocalDateTime 序列化为字符串而非数组
    serialization:
      write-dates-as-timestamps: false
    # 忽略null字段
    default-property-inclusion: non_null
    # 下划线转驼峰
    property-naming-strategy: LOWER_CAMEL_CASE

# MyBatis-Plus配置
mybatis-plus:
  # Mapper XML位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描路径
  type-aliases-package: com.videoai.common.domain
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 打印SQL（开发环境）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：自增
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: info
    com.videoai: debug
    # SQL日志
    com.videoai.infra.mysql.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 业务配置
videoai:
  upload:
    # 分片大小（字节）：5MB
    chunk-size: 5242880
    max-chunk-size: 1073741824
    # 上传会话过期时间（小时）
    session-expire-hours: 24
    # 允许的文件类型
    allowed-types: mp4,avi,mov,mkv,wmv,flv
    # 最大文件大小（字节）：5GB
    max-file-size: 5368709120

  # 限流配置
  rate-limit:
    # 全局QPS限制
    global-qps: 1000
    # 单用户上传QPS限制
    user-upload-qps: 10
    # 单用户API QPS限制
    user-api-qps: 100

  # JWT配置
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-must-be-at-least-32-chars}
    expiration: 86400000

  # CORS 配置
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8080
      - http://127.0.0.1:8080

  # OAuth 配置
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/oauth/github/callback}
      frontend-url: ${FRONTEND_URL:http://localhost:5173}

# SpringDoc / Swagger配置
  rag:
    enabled: true
    fail-open: true
    knowledge-base: apex-default
    top-k: 12
    final-top-k: 6
    max-chunks-per-card: 2
    min-score: 0.72
    max-context-chars: 3500
    chunk-target-chars: 650
    chunk-min-chars: 400
    chunk-max-chars: 800
    chunk-overlap-chars: 100
    dispatch-batch-size: 20
    dispatch-send-timeout-seconds: 10
    queued-recovery-timeout-seconds: 60
    processing-timeout-seconds: 1800
    rebuild-processing-timeout-seconds: 21600
    vector:
      provider: milvus
      base-url: ${MILVUS_BASE_URL:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      database: default
      collection: apex_knowledge_chunk
      metric-type: COSINE
      index-type: HNSW
      connect-timeout-seconds: 10
      timeout-seconds: 30
      hnsw-m: 16
      hnsw-ef-construction: 200
      search-ef: 64
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:dashscope}
      base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${RAG_EMBEDDING_API_KEY:}
      model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
      dimension: 1024
      connect-timeout-seconds: 10
      timeout-seconds: 30
      dashscope:
        text-type: ${RAG_DASHSCOPE_TEXT_TYPE:document}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
