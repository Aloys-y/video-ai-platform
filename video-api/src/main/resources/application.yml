server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: video-api

  # 环境配置
  profiles:
    active: dev

  # 文件上传配置
  servlet:
    multipart:
      # 单个文件大小限制（分片上传不受此限制，因为分片走自定义接口）
      max-file-size: 1GB
      # 总上传大小限制
      max-request-size: 1100MB

  # Jackson配置
  jackson:
    # 日期格式
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区
    time-zone: Asia/Shanghai
    # LocalDateTime 序列化为字符串而非数组
    serialization:
      write-dates-as-timestamps: false
    # 忽略null字段
    default-property-inclusion: non_null
    # 下划线转驼峰
    property-naming-strategy: LOWER_CAMEL_CASE

# MyBatis-Plus配置
mybatis-plus:
  # Mapper XML位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描路径
  type-aliases-package: com.videoai.common.domain
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 打印SQL（开发环境）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：自增
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: info
    com.videoai: debug
    # SQL日志
    com.videoai.infra.mysql.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 业务配置
videoai:
  analysis:
    # 只影响新任务，白名单为空时全部沿用整片模式。
    prefilter-enabled: ${AUDIO_PREFILTER_ENABLED:false}
    prefilter-user-ids: ${AUDIO_PREFILTER_USER_IDS:}
  upload:
    # 分片大小（字节）：5MB
    chunk-size: 5242880
    max-chunk-size: 1073741824
    # 上传会话过期时间（小时）
    session-expire-hours: 24
    # 允许的文件类型
    allowed-types: mp4,avi,mov,mkv,wmv,flv
    # 最大文件大小（字节）：5GB
    max-file-size: 5368709120

  # 限流配置
  rate-limit:
    # 全局QPS限制
    global-qps: 1000
    # 单用户上传QPS限制
    user-upload-qps: 10
    # 单用户API QPS限制
    user-api-qps: 100

  # JWT配置
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-must-be-at-least-32-chars}
    expiration: 86400000

  # CORS 配置
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8080
      - http://127.0.0.1:8080

  # OAuth 配置
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/oauth/github/callback}
      frontend-url: ${FRONTEND_URL:http://localhost:5173}

# SpringDoc / Swagger配置
  rag:
    legend-alias-enhancement-enabled: ${RAG_LEGEND_ALIAS_ENHANCEMENT_ENABLED:true}
    # 消融实验确认长标题路径会稀释正文语义；元数据仍保留 heading_path，仅不再参与 Embedding
    embedding-heading-path-enabled: ${RAG_EMBEDDING_HEADING_PATH_ENABLED:false}
    shadow-index-build-enabled: ${RAG_SHADOW_INDEX_BUILD_ENABLED:false}
    enabled: true
    fail-open: true
    knowledge-base: apex-default
    query-expansion-enabled: false
    # 当前知识域只包含 PC 英雄玩法卡片；类别过滤作为后续扩充语料时的安全边界
    legend-pc-gameplay-filter-enabled: ${RAG_LEGEND_PC_GAMEPLAY_FILTER_ENABLED:true}
    # 混合检索仍处于实验阶段：Milvus 语义召回 + 内存 BM25 + RRF，默认不影响基准链路
    hybrid-retrieval-enabled: ${RAG_HYBRID_RETRIEVAL_ENABLED:false}
    hybrid-conditional-rescue-enabled: ${RAG_HYBRID_CONDITIONAL_RESCUE_ENABLED:false}
    hybrid-conditional-rescue-min-dense-score: ${RAG_HYBRID_CONDITIONAL_RESCUE_MIN_DENSE_SCORE:0.60}
    hybrid-conditional-rescue-max-chunks: ${RAG_HYBRID_CONDITIONAL_RESCUE_MAX_CHUNKS:1}
    hybrid-lexical-union-enabled: ${RAG_HYBRID_LEXICAL_UNION_ENABLED:false}
    lexical-top-k: ${RAG_LEXICAL_TOP_K:20}
    rrf-k: ${RAG_RRF_K:60}
    dense-rrf-weight: ${RAG_DENSE_RRF_WEIGHT:1.0}
    lexical-rrf-weight: ${RAG_LEXICAL_RRF_WEIGHT:1.0}
    lexical-index-ttl-seconds: ${RAG_LEXICAL_INDEX_TTL_SECONDS:300}
    top-k: ${RAG_TOP_K:20}
    final-top-k: ${RAG_FINAL_TOP_K:3}
    max-chunks-per-card: ${RAG_MAX_CHUNKS_PER_CARD:2}
    # 中文英雄 bench 首轮实测值：不降低正例/Section 指标，并将负例拒绝率由 75% 提升到 87.5%
    min-score: ${RAG_MIN_SCORE:0.62}
    max-context-chars: ${RAG_MAX_CONTEXT_CHARS:3500}
    chunk-target-chars: 650
    chunk-min-chars: 400
    chunk-max-chars: 800
    chunk-overlap-chars: 100
    vector:
      provider: milvus
      base-url: ${MILVUS_BASE_URL:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      database: default
      collection: ${VIDEOAI_RAG_VECTOR_COLLECTION:apex_knowledge_chunk_experiment_no_heading_v1}
      metric-type: COSINE
      index-type: HNSW
      connect-timeout-seconds: 10
      timeout-seconds: 30
      hnsw-m: 16
      hnsw-ef-construction: 200
      search-ef: 64
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:dashscope}
      base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${RAG_EMBEDDING_API_KEY:}
      model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
      dimension: 1024
      connect-timeout-seconds: 10
      timeout-seconds: 30
      dashscope:
        text-type: ${RAG_DASHSCOPE_TEXT_TYPE:document}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
